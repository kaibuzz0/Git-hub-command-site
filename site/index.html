<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#181818"><meta name="description" content="Multi-repository GitHub command center"><title>GitHub Command Site</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css"></head>
<body><div id="app"><aside class="activity"><button data-view="home" class="active" title="Home">⌂</button><button data-view="repositories" title="Repositories">◫</button><button data-view="tools" title="Tools">⌘</button><button data-view="activity" title="Activity">↻</button><button id="paletteBtn" title="Command Palette">›_</button></aside><aside class="sidebar"><div class="brand">GITHUB COMMAND</div><input id="search" placeholder="Search workspace…"><div id="tree"></div></aside><main><header><span id="crumb">COMMAND / HOME</span><span id="status">loading…</span></header><section id="content"></section><footer><span>multi-repo</span><span id="syncState">snapshot registry</span><span>Ctrl+K command palette</span></footer></main></div><div id="palette" class="overlay hidden"><div class="palette-box"><input id="paletteInput" placeholder="Type a command or search…"><div id="paletteResults"></div></div></div><script src="app.js"></script></body></html>
