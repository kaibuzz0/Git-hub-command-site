<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1e1e1e">
  <meta name="description" content="VS Code-inspired multi-repository GitHub command workbench">
  <title>GitHub Command Workbench</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="repository_explorer.css">
</head>
<body>
<div id="app">
  <aside class="activity" aria-label="Activity Bar">
    <button data-view="home" class="active" title="Command Center">⌂</button>
    <button data-view="repositories" title="Explorer">▱</button>
    <button data-view="search" title="Search">⌕</button>
    <button data-view="source-control" title="Source Control">⑂</button>
    <button data-view="run-debug" title="Run and Debug">▷</button>
    <button data-view="editor" title="Editor">▤</button>
    <button data-view="workspace-tools" title="Workspace Tools">⬡</button>
    <span class="activity-spacer"></span>
    <button data-view="settings" title="Settings">⚙</button>
    <button id="paletteBtn" title="Command Palette">›_</button>
  </aside>
  <aside class="sidebar">
    <div class="brand">COMMAND WORKBENCH</div>
    <div id="sidebarTitle" class="sidebar-title">EXPLORER</div>
    <input id="search" placeholder="Search workspace…" autocomplete="off">
    <div id="tree"></div>
  </aside>
  <main>
    <header>
      <span id="crumb">WORKBENCH / HOME</span>
      <span id="status">loading…</span>
    </header>
    <section id="content"></section>
    <section id="bottomPanel" class="bottom-panel hidden">
      <div class="panel-tabs"><button class="active">OUTPUT</button><button id="closePanel">×</button></div>
      <pre id="panelOutput">Command Workbench ready.</pre>
    </section>
    <footer>
      <span>◉ main</span>
      <span id="syncState">snapshot registry</span>
      <span id="runnerState">runner: adapter</span>
      <span class="footer-spacer"></span>
      <span>Ctrl+K palette</span>
    </footer>
  </main>
</div>
<div id="palette" class="overlay hidden">
  <div class="palette-box">
    <input id="paletteInput" placeholder="> Type a command…" autocomplete="off">
    <div id="paletteResults"></div>
  </div>
</div>
<script src="app.js"></script>
<script src="repository_explorer.js"></script>
</body>
</html>
