name: Deploy command site
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Monaco editor
        run: npm install --ignore-scripts --no-save --no-audit --no-fund monaco-editor@0.55.1
      - name: Validate remote repository registry
        run: python scripts/sync_repositories.py --validate
      - name: Fetch connected repository snapshots
        run: python scripts/sync_repositories.py
      - name: Validate repository snapshots
        run: python scripts/build_hub.py --validate
      - name: Generate aggregate site data
        run: python scripts/build_hub.py
      - name: Generate repository mini-sites
        run: python scripts/build_repository_sites.py --input site-data --output repo-sites
      - name: Assemble static site
        run: |
          mkdir -p _site/site-data _site/vendor/monaco _site/repos
          cp -R site/. _site/
          cp -R site-data/. _site/site-data/
          cp -R repo-sites/. _site/repos/
          cp -R node_modules/monaco-editor/min/vs _site/vendor/monaco/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
