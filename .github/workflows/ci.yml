name: Validate hub
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Compile workbench scripts
        run: python -m py_compile scripts/build_hub.py scripts/build_repository_sites.py scripts/sync_repositories.py scripts/onboard_repository.py scripts/connect_repository.py connectors/export_repo_snapshot.py connectors/build_repo_site.py
      - name: Validate workbench JavaScript
        run: |
          node --check site/app.js
          node --check site/repository_explorer.js
          node --check site/internal_editor.js
          node --check site/workbench_v4.js
          node --check site/workbench_v5.js
      - name: Run tests
        run: python -m pytest tests/ -vv --tb=short --junitxml=test-results.xml
      - name: Validate remote registry
        run: python scripts/sync_repositories.py --validate
      - name: Validate snapshots
        run: python scripts/build_hub.py --validate
      - name: Build aggregate data
        run: python scripts/build_hub.py
      - name: Build repository mini-sites
        run: python scripts/build_repository_sites.py --input site-data --output repo-sites
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-validation-${{ matrix.python-version }}
          path: |
            test-results.xml
            site-data/
            repo-sites/
